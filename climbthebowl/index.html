    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }

    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

<body>
  <div id="__bundler_placeholder">Loading Climb the Bowl...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

shadow:0 0 0 0 rgba(246,212,74,.85)}70%{box-shadow:0 0 0 18px rgba(246,212,74,0)}100%{box-shadow:0 0 0 0 rgba(246,212,74,0)}}\n.pulse{animation:bowlpulse 1.6s ease-out infinite}\n.stop{cursor:pointer;transition:transform .15s ease}\n.stop:hover:not(:disabled){transform:scale(1.12)}\n.stop:disabled{cursor:not-allowed}\n.opt{cursor:pointer;transition:border-color .15s ease}\n.opt:hover:not(:disabled){border-color:#C2410C}\n.opt:disabled{cursor:default}\n.cta{cursor:pointer;transition:filter .15s ease}\n.cta:hover{filter:brightness(1.12)}\nbutton:focus-visible{outline:3px solid #F6D44A;outline-offset:3px}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width: 1300px; height: 1010px; box-sizing: border-box; padding: 12px; display: flex; gap: 24px; background: #1A2212; font-family: 'Work Sans', sans-serif; color: #1E2614\" data-canvas-width=\"1300\" data-canvas-height=\"1010\" data-document-role=\"page\" data-label=\"Climb the Bowl — game board\">\n\n  <div style=\"position: relative; width: 700px; height: 986px; flex: none; border-radius: 14px; overflow: hidden; background: #2A3418\">\n    <img src=\"be8774ef-b0ba-4743-b192-ce909cf76a90\" alt=\"Illustrated map of the Santa Barbara Bowl, from the Milpas Street entrance up to the Scranton Overlook\" style=\"width: 700px; height: 986px; display: block\">\n    <svg width=\"700\" height=\"986\" sc-camel-view-box=\"0 0 700 986\" aria-hidden=\"true\" style=\"position: absolute; left: 0; top: 0; pointer-events: none\">\n      <polyline points=\"{{trailPoints}}\" fill=\"none\" stroke=\"#F6D44A\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"2 11\"><\u002Fpolyline>\n    <\u002Fsvg>\n    <sc-for list=\"{{markers}}\" as=\"m\" hint-placeholder-count=\"11\">\n      <button type=\"button\" class=\"{{m.cls}}\" style=\"{{m.style}}\" sc-camel-on-click=\"{{m.pick}}\" disabled=\"{{m.disabled}}\" aria-label=\"{{m.aria}}\">{{m.label}}<\u002Fbutton>\n    <\u002Fsc-for>\n    <div style=\"position: absolute; left: 16px; bottom: 16px; display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 999px; background: rgba(20,26,12,0.82); color: #F6F1E4; font-size: 13px; font-weight: 600\">\n      <span style=\"width: 12px; height: 12px; border-radius: 50%; background: {{accent}}; border: 2px solid #FFFFFF\"><\u002Fspan>\n      <span>You are here<\u002Fspan>\n      <span style=\"width: 12px; height: 12px; border-radius: 50%; background: #2F6B3A; border: 2px solid #FFFFFF; margin-left: 8px\"><\u002Fspan>\n      <span>Card found<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex: 1; min-width: 0; height: 986px; box-sizing: border-box; background: #F6F1E4; border-radius: 14px; padding: 30px 34px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto\">\n\n    <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 16px\">\n      <div style=\"display: flex; flex-direction: column; gap: 4px\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #4A5A2E\">Santa Barbara Bowl · 90th Summer<\u002Fdiv>\n        <h1 style=\"margin: 0; font-family: 'Bowlby One', sans-serif; font-weight: 400; font-size: 38px; line-height: 1.05; color: #1E2614\">Climb the Bowl<\u002Fh1>\n      <\u002Fdiv>\n      <div style=\"flex: none; display: flex; flex-direction: column; align-items: center; padding: 8px 16px; border-radius: 12px; background: #1E2614; color: #F6F1E4\">\n        <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #D4E04A\">Score<\u002Fspan>\n        <span style=\"font-family: 'Bowlby One', sans-serif; font-size: 28px; line-height: 1.1\">{{score}}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-direction: column; gap: 8px\">\n      <div style=\"display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #3B4A24\">\n        <span>Setlist cards found<\u002Fspan>\n        <span>{{answeredCount}} of 11<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height: 10px; border-radius: 999px; background: #E4DCC5; overflow: hidden\">\n        <div style=\"{{progressStyle}}\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px\">\n      <sc-for list=\"{{themes}}\" as=\"t\" hint-placeholder-count=\"4\">\n        <div style=\"{{t.chipStyle}}\">\n          <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.2\">{{t.name}}<\u002Fspan>\n          <span style=\"font-size: 18px; font-weight: 700\">{{t.count}}/{{t.total}}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{isIntro}}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 18px; padding-top: 6px\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #C2410C\">Prologue · Milpas Street, 4:45 pm<\u002Fdiv>\n        <h2 style=\"margin: 0; font-family: 'Bowlby One', sans-serif; font-weight: 400; font-size: 28px; line-height: 1.15\">The setlist blew away<\u002Fh2>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.6\">It’s the Santa Barbara Bowl’s 90th summer, and you’ve scored a backstage pass. Then an afternoon gust scatters the headliner’s setlist across the hillside — eleven cards, from the sidewalk to the Scranton Overlook.<\u002Fp>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.6\">Juniper, a stagehand who knows every inch of these 17 acres, will guide you up. Along the way you’ll learn why this 1936 amphitheater runs as a nonprofit, keeps its footprint small, buys local and invests in young artists.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; border-radius: 12px; background: #EDE5CF\">\n          <div style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #3B4A24\">How to play<\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.5\">Tap the glowing stop on the map, or use the button below.<\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.5\">Answer each stop’s question: +100 if you’re right, +25 for trying. Every answer wins the card.<\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.5\">Stops unlock bottom to top. Tap any green stop to revisit it.<\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" class=\"cta\" sc-camel-on-click=\"{{start}}\" style=\"align-self: flex-start; min-height: 52px; padding: 0 28px; border: 0; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font-family: 'Work Sans', sans-serif; font-size: 17px; font-weight: 700\">Start the climb →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{isPlay}}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 14px; padding-top: 4px\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #C2410C\">{{cur.kicker}}<\u002Fdiv>\n        <h2 style=\"margin: 0; font-family: 'Bowlby One', sans-serif; font-weight: 400; font-size: 28px; line-height: 1.15\">{{cur.place}}<\u002Fh2>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.6\">{{cur.story}}<\u002Fp>\n        <div style=\"font-size: 16px; font-weight: 700; line-height: 1.4; padding-top: 4px\">{{cur.q}}<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <sc-for list=\"{{options}}\" as=\"o\" hint-placeholder-count=\"3\">\n            <button type=\"button\" class=\"opt\" style=\"{{o.style}}\" sc-camel-on-click=\"{{o.pick}}\" disabled=\"{{o.disabled}}\">{{o.label}}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{answered}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 14px\">\n            <div style=\"display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 12px; background: #1E2614; color: #F6F1E4\">\n              <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #D4E04A\">{{feedbackTitle}}<\u002Fdiv>\n              <div style=\"font-size: 15px; line-height: 1.55\">{{cur.fact}}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap\">\n              <div style=\"display: flex; flex-direction: column; gap: 2px\">\n                <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4A5A2E\">{{cardLabel}}<\u002Fspan>\n                <span style=\"font-family: 'Bowlby One', sans-serif; font-size: 18px\">“{{cur.track}}”<\u002Fspan>\n              <\u002Fdiv>\n              <button type=\"button\" class=\"cta\" sc-camel-on-click=\"{{next}}\" style=\"min-height: 48px; padding: 0 22px; border: 0; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 700\">{{nextLabel}}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{isDone}}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 16px; padding-top: 4px\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #C2410C\">Encore · Scranton Overlook<\u002Fdiv>\n        <h2 style=\"margin: 0; font-family: 'Bowlby One', sans-serif; font-weight: 400; font-size: 30px; line-height: 1.15\">{{rankTitle}}<\u002Fh2>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.6\">{{rankText}}<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; border-radius: 12px; background: #1E2614; color: #F6F1E4\">\n          <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #D4E04A\">Tonight’s setlist<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 18px\">\n            <sc-for list=\"{{tracks}}\" as=\"tr\" hint-placeholder-count=\"11\">\n              <div style=\"display: flex; gap: 8px; font-size: 14px; line-height: 1.4\">\n                <span style=\"color: #D4E04A; font-weight: 700; min-width: 20px\">{{tr.n}}<\u002Fspan>\n                <span>{{tr.title}}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: #3B4A24\">Every ticket, pint and donation at the Bowl circles back to the venue, its hillside and arts education for local kids.<\u002Fp>\n        <button type=\"button\" class=\"cta\" sc-camel-on-click=\"{{restart}}\" style=\"align-self: flex-start; min-height: 50px; padding: 0 26px; border: 0; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font-family: 'Work Sans', sans-serif; font-size: 16px; font-weight: 700\">Climb again<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C2410C&quot;,&quot;options&quot;:[&quot;#C2410C&quot;,&quot;#1F5F8B&quot;,&quot;#2F6B3A&quot;,&quot;#7A3E9D&quot;]},&quot;showTrail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;$preview&quot;:{&quot;width&quot;:1300,&quot;height&quot;:1010}}\">\nvar THEMES = [\n  { id: \"green\", name: \"Sustain­ability\", color: \"#2F6B3A\" },\n  { id: \"local\", name: \"Local roots\", color: \"#9A3412\" },\n  { id: \"nonprofit\", name: \"Nonprofit\", color: \"#1F5F8B\" },\n  { id: \"youth\", name: \"Arts & youth\", color: \"#7A3E9D\" }\n];\n\nvar STOPS = [\n  { x: 458, y: 838, zone: \"Lower Plaza\", place: \"The Welcome Sign\", theme: \"green\", track: \"Pedal Power\",\n    story: \"Juniper, a stagehand with a headlamp and a clipboard, meets you at the Welcome sign on Milpas Street and nods at a row of bikes being tagged. “First lesson: the greenest way into the Bowl is to leave the car at home.” Card #1 is tucked in a bike basket.\",\n    q: \"What free service does the Bowl offer guests who ride in?\",\n    opts: [\"A free Bike Valet\", \"E-scooter rentals\", \"A paid VIP garage\"], a: 0,\n    fact: \"The Bowl encourages car-free and rideshare trips, and its complimentary Bike Valet parked 3,018 bikes in 2023.\" },\n\n  { x: 281, y: 744, zone: \"Lower Plaza\", place: \"Dreier Box Office\", theme: \"local\", track: \"Carved in ’36\",\n    story: \"At Will Call, Juniper raps her knuckles on the stone. “Before it was a venue, this hillside was a dry creek bed. Depression-era crews carved it into an amphitheater for the town’s Fiesta pageant.” Card #2 is wedged in the ticket window.\",\n    q: \"What built the Santa Barbara Bowl in 1936?\",\n    opts: [\"A Hollywood studio\", \"A private hotel developer\", \"A federal WPA public-works project\"], a: 2,\n    fact: \"The Bowl was a Works Progress Administration project, built with about $77,000 in Depression-era funds and opened in August 1936 — which makes 2026 its 90th summer.\" },\n\n  { x: 616, y: 821, zone: \"Lower Plaza\", place: \"Guest Services\", theme: \"nonprofit\", track: \"Every Dollar Back\",\n    story: \"Card #3 has blown up against Guest Services, where staff are handing a lost jacket back to its owner. “Here’s the part people miss,” Juniper says. “Nobody’s getting rich off this place. The money comes back up the hill.”\",\n    q: \"Who runs the Santa Barbara Bowl today?\",\n    opts: [\"A national concert chain\", \"The nonprofit Santa Barbara Bowl Foundation\", \"The state parks system\"], a: 1,\n    fact: \"The nonprofit Santa Barbara Bowl Foundation has run the venue since the early 1990s and has reinvested more than $42 million into renovating it.\" },\n\n  { x: 481, y: 712, zone: \"Lower Plaza\", place: \"The Shuttle Stop\", theme: \"green\", track: \"Small Footprint\",\n    story: \"A red shuttle pulls into the Lower Plaza and a wave of fans spills out. Juniper grins. “Four thousand–plus people, one hillside, and a plan to keep our footprint as small as we can.” Card #4 is stuck to the shuttle’s back window.\",\n    q: \"What’s the big goal of the Bowl’s “Greening the Bowl” effort?\",\n    opts: [\"Bigger parking lots\", \"Getting as close to carbon neutral as possible\", \"Louder speakers\"], a: 1,\n    fact: \"Greening the Bowl aims to make the venue as close to carbon neutral as possible — starting with getting fans here by shuttle, bike or rideshare.\" },\n\n  { x: 397, y: 582, zone: \"Redding Gate\", place: \"Redding Gate\", theme: \"youth\", track: \"Field Trip\",\n    story: \"Past Security and Ticket Scan, you reach the Redding Gate, draped in vines. Juniper points back toward The Hole. “On school days, buses line up down there. Daytime, this place turns into a classroom.” Card #5 is clipped to the wristband table.\",\n    q: \"Besides concert crowds, who does the Bowl bring up this hill?\",\n    opts: [\"Local students, sometimes thousands at once\", \"Only ticket holders over 21\", \"Touring film crews\"], a: 0,\n    fact: \"Through its Education Outreach work, the Bowl has brought as many as 4,000 students at a time to experience live performance as part of their schooling.\" },\n\n  { x: 503, y: 449, zone: \"Jerry Garcia Glen\", place: \"Jerry Garcia Glen\", theme: \"green\", track: \"Island of Oaks\",\n    story: \"The path bends into Jerry Garcia Glen, where the Jerry’s Hand sculpture rises from the boulders and the trees close in overhead. Juniper crouches by a native shrub. “Look around. We’re an island of wild ground in the middle of the city.” Card #6 is snagged in its branches.\",\n    q: \"What kind of plants does the Bowl favor on its hillside?\",\n    opts: [\"Thirsty lawn turf\", \"Imported tropical palms\", \"Native, drought-tolerant California plants\"], a: 2,\n    fact: \"The Foundation stewards a 17-acre island of open space, growing native and drought-tolerant California plants to keep a healthy micro-environment.\" },\n\n  { x: 582, y: 398, zone: \"Main Plaza\", place: \"Snack Stand & Locals Only Bar\", theme: \"local\", track: \"Taste the County\",\n    story: \"The Main Plaza smells like a farmers market. Juniper reads the snack-stand chalkboard out loud like a setlist, then nods toward the Locals Only Bar. “If it’s on the menu, there’s a good chance it came from just down the road.” Card #7 is under a napkin dispenser.\",\n    q: \"What’s the rule of thumb for Bowl concessions?\",\n    opts: [\"Local, natural and organic\", \"Whatever ships cheapest\", \"National fast-food brands only\"], a: 0,\n    fact: \"Every concession at the Bowl follows a local, natural and organic focus — the menu tastes like the county the venue sits in.\" },\n\n  { x: 614, y: 311, zone: \"Main Plaza\", place: \"Water Station & Towbes Café\", theme: \"green\", track: \"Refill\",\n    story: \"By Towbes Café, fans fill bottles at the Water Station while a volunteer stacks returned pint cups. “Nothing here gets used once and tossed if we can help it,” Juniper says. Card #8 is floating in the cup-return bin.\",\n    q: \"What return rate did the Bowl’s reusable r.Cup pint program hit?\",\n    opts: [\"About 45%\", \"About 70%\", \"A record 97%\"], a: 2,\n    fact: \"Free water stations refill bottles for every guest and artist, and the reusable r.Cup pint program set a record 97% return rate. Bring your souvenir pint back for $2 off a refill.\" },\n\n  { x: 341, y: 360, zone: \"McCaw Terrace\", place: \"McCaw Terrace\", theme: \"youth\", track: \"Next Generation\",\n    story: \"Up on McCaw Terrace, supporters gather before the show. Juniper lowers her voice. “This is where the next generation of musicians gets funded — instruments, lessons, the works.” Card #9 is pinned to the donor board.\",\n    q: \"What does the Foundation’s Education Outreach program support?\",\n    opts: [\"Performing arts education for local youth\", \"Stadium construction out of state\", \"Discounts for touring bands\"], a: 0,\n    fact: \"Education Outreach funds arts advocacy, mentorship and need-based aid for performing arts programs across Santa Barbara County, with the goal of a permanent endowment.\" },\n\n  { x: 444, y: 141, zone: \"The House\", place: \"The Pavilion & Stage\", theme: \"green\", track: \"Solar Hour\",\n    story: \"Climb the Henley Stairway and the House opens up: 4,562 seats, the Pavilion overhead, the stage lights warming. Juniper squints at the late sun. “On show night, the sun does a lot of the heavy lifting.” Card #10 is taped to a monitor wedge.\",\n    q: \"About how much of the Bowl’s yearly electricity is offset by its own solar?\",\n    opts: [\"About 10%\", \"About 75%\", \"About 30%\"], a: 1,\n    fact: \"Bowl solar offsets about 75% of the electricity the venue uses each year, with net-zero annual energy as the goal.\" },\n\n  { x: 89, y: 284, zone: \"Scranton Overlook\", place: \"Scranton Overlook\", theme: \"nonprofit\", track: \"Encore at the Overlook\",\n    story: \"One last push to Scranton Overlook. The sun drops toward the Pacific, the crowd hums below, and there on the rail is Card #11. Juniper hands you the full setlist. “Ninety summers, and it’s still everybody’s Bowl.”\",\n    q: \"When you buy a Bowl ticket, the money ultimately supports…\",\n    opts: [\"An out-of-state venue owner\", \"A nonprofit caring for the venue and local arts\", \"Shareholder dividends\"], a: 1,\n    fact: \"Every ticket supports a nonprofit that cares for this 90-year-old amphitheater, its 17-acre hillside and arts education for local young people.\" }\n];\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { stage: \"intro\", idx: 0, answers: {} };\n  }\n\n  answeredCount() {\n    return Object.keys(this.state.answers).length;\n  }\n\n  renderVals() {\n    var self = this;\n    var accent = this.props.accent ?? \"#C2410C\";\n    var showTrail = this.props.showTrail ?? true;\n    var st = this.state;\n    var answers = st.answers;\n    var count = this.answeredCount();\n    var isPlay = st.stage === \"play\";\n\n    var score = 0;\n    var themeCounts = {};\n    var themeTotals = {};\n    STOPS.forEach(function (s, i) {\n      themeTotals[s.theme] = (themeTotals[s.theme] || 0) + 1;\n      if (answers[i] !== undefined) {\n        var right = answers[i] === s.a;\n        score += right ? 100 : 25;\n        if (right) themeCounts[s.theme] = (themeCounts[s.theme] || 0) + 1;\n      }\n    });\n\n    var markers = STOPS.map(function (s, i) {\n      var done = answers[i] !== undefined;\n      var current = isPlay && st.idx === i;\n      var unlocked = i <= count;\n      var bg, fg, border;\n      if (current) { bg = accent; fg = \"#FFFFFF\"; border = \"#FFFFFF\"; }\n      else if (done) { bg = \"#2F6B3A\"; fg = \"#FFFFFF\"; border = \"#F6F1E4\"; }\n      else if (unlocked) { bg = \"#F6D44A\"; fg = \"#1E2614\"; border = \"#1E2614\"; }\n      else { bg = \"rgba(26,34,18,0.78)\"; fg = \"#B7BFA6\"; border = \"#6C7559\"; }\n      var glow = (!isPlay && st.stage !== \"done\" && i === 0) || (current && !done) || (isPlay && !done && unlocked && st.idx !== i);\n      return {\n        label: String(i + 1),\n        cls: \"stop\" + (glow ? \" pulse\" : \"\"),\n        disabled: !unlocked,\n        aria: \"Stop \" + (i + 1) + \": \" + s.place + (done ? \" (card found)\" : unlocked ? \"\" : \" (locked)\"),\n        style: \"position: absolute; left: \" + (s.x - 22) + \"px; top: \" + (s.y - 22) + \"px; width: 44px; height: 44px; border-radius: 50%; border: 3px solid \" + border + \"; background: \" + bg + \"; color: \" + fg + \"; font-family: 'Work Sans', sans-serif; font-size: 17px; font-weight: 700; padding: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box\",\n        pick: function () {\n          if (i <= self.answeredCount()) self.setState({ stage: \"play\", idx: i });\n        }\n      };\n    });\n\n    var trail = [];\n    STOPS.forEach(function (s, i) {\n      if (answers[i] !== undefined || (isPlay && i === count)) trail.push(s.x + \",\" + s.y);\n    });\n    if (st.stage === \"done\") trail = STOPS.map(function (s) { return s.x + \",\" + s.y; });\n    var trailPoints = showTrail ? trail.join(\" \") : \"\";\n\n    var themes = THEMES.map(function (t) {\n      var c = themeCounts[t.id] || 0;\n      var tot = themeTotals[t.id] || 0;\n      var full = tot > 0 && c === tot;\n      return {\n        name: t.name, count: c, total: tot,\n        chipStyle: \"display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 10px; border: 2px solid \" + t.color + \"; background: \" + (full ? t.color : \"#FFFFFF\") + \"; color: \" + (full ? \"#FFFFFF\" : t.color)\n      };\n    });\n\n    var s = STOPS[st.idx];\n    var chosen = answers[st.idx];\n    var answered = chosen !== undefined;\n    var right = answered && chosen === s.a;\n    var themeName = THEMES.filter(function (t) { return t.id === s.theme; })[0].name.replace(\"­\", \"\");\n\n    var options = s.opts.map(function (label, oi) {\n      var bg = \"#FFFFFF\", border = \"#D9D0B8\", fg = \"#1E2614\", op = \"1\";\n      if (answered) {\n        if (oi === s.a) { bg = \"#DDEFD9\"; border = \"#2F6B3A\"; }\n        else if (oi === chosen) { bg = \"#FBE1D3\"; border = \"#9A3412\"; }\n        else { op = \"0.55\"; }\n      }\n      return {\n        label: (answered && oi === s.a ? \"✓  \" : \"\") + label,\n        disabled: answered,\n        style: \"min-height: 48px; width: 100%; text-align: left; padding: 10px 16px; border-radius: 10px; border: 2px solid \" + border + \"; background: \" + bg + \"; color: \" + fg + \"; opacity: \" + op + \"; font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 600; line-height: 1.35\",\n        pick: function () {\n          if (self.state.answers[self.state.idx] !== undefined) return;\n          var next = Object.assign({}, self.state.answers);\n          next[self.state.idx] = oi;\n          self.setState({ answers: next });\n        }\n      };\n    });\n\n    var lastStop = st.idx === STOPS.length - 1;\n    var allDone = count === STOPS.length;\n    var nextLabel;\n    if (allDone && (lastStop || st.idx === count - 1)) nextLabel = \"See your setlist →\";\n    else if (allDone) nextLabel = \"See your setlist →\";\n    else if (st.idx + 1 < count) nextLabel = \"Back to the climb →\";\n    else nextLabel = \"Head to \" + STOPS[Math.min(st.idx + 1, STOPS.length - 1)].place + \" →\";\n\n    var rankTitle, rankText;\n    if (score >= 1000) { rankTitle = \"Headliner status\"; rankText = \"You climbed from Milpas Street to the overlook and nailed nearly every stop. Juniper is putting your name on the guest list for next summer.\"; }\n    else if (score >= 700) { rankTitle = \"Opening act\"; rankText = \"Strong climb. You found all eleven cards and picked up most of the story of how a 1936 public-works stage became a nonprofit, solar-powered, locally rooted venue.\"; }\n    else { rankTitle = \"Roadie in training\"; rankText = \"You found all eleven cards — and now you know more than most fans walking in. Climb again to chase a headliner score.\"; }\n\n    return {\n      accent: accent,\n      score: score,\n      answeredCount: count,\n      progressStyle: \"height: 100%; width: \" + Math.round((count / STOPS.length) * 100) + \"%; background: \" + accent + \"; border-radius: 999px; transition: width .4s ease\",\n      markers: markers,\n      trailPoints: trailPoints,\n      themes: themes,\n      isIntro: st.stage === \"intro\",\n      isPlay: isPlay,\n      isDone: st.stage === \"done\",\n      cur: {\n        kicker: \"Stop \" + (st.idx + 1) + \" of 11 · \" + s.zone + \" · \" + themeName,\n        place: s.place, story: s.story, q: s.q, fact: s.fact, track: s.track\n      },\n      options: options,\n      answered: answered,\n      feedbackTitle: right ? \"Nailed it · +100 · Did you know\" : \"Good try · +25 · Here’s the story\",\n      cardLabel: \"Setlist card #\" + (st.idx + 1) + \" found\",\n      nextLabel: nextLabel,\n      tracks: STOPS.map(function (x, i) { return { n: String(i + 1), title: x.track }; }),\n      rankTitle: rankTitle,\n      rankText: rankText,\n      start: function () { self.setState({ stage: \"play\", idx: 0 }); },\n      next: function () {\n        var c = self.answeredCount();\n        if (c === STOPS.length) { self.setState({ stage: \"done\" }); return; }\n        self.setState({ stage: \"play\", idx: c });\n      },\n      restart: function () { self.setState({ stage: \"intro\", idx: 0, answers: {} }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"

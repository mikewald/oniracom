<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The District216 Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6efff; --ink:#2a1450; --muted:#5d4a86; --line:#2b2d42;
  --sign-bg:#ebe7f1; --sign-ink:#2b2d42;
  --btn:#ff4fd8; --btn2:#7b2ff7; --btn-ink:#ffffff; --icon-bg:#ffffff; --icon-ink:#2b2d42;
  --banner-bg:#fff6fb; --banner-ink:#2a1450;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12082b; --ink:#f6eaff; --muted:#c7b3ee; --icon-bg:#2a1854; --icon-ink:#f6eaff;
    --banner-bg:#2a1854; --banner-ink:#f6eaff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12082b; --ink:#f6eaff; --muted:#c7b3ee; --icon-bg:#2a1854; --icon-ink:#f6eaff;
  --banner-bg:#2a1854; --banner-ink:#f6eaff;
  color-scheme: dark;
}
:root{box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; background:var(--bg); color:var(--ink); font-family:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif}
header{max-width:1200px; margin:0 auto; padding:18px 16px 10px; display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 16px}
h1{font-family:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif; font-weight:400; font-size:clamp(1.5rem,3.6vw,2.4rem); margin:0; letter-spacing:.5px}
header p{margin:0; color:var(--muted); font-weight:600}

.scroller{max-width:1200px; margin:0 auto; overflow-x:auto; overflow-y:hidden; border-radius:22px; border:4px solid var(--line)}
.sizer{position:relative}
#stage{position:absolute; top:0; left:0; width:1200px; height:640px; transform-origin:0 0; overflow:hidden; background:#12082b}
#scene{position:absolute; inset:0}
#trippy{animation:hue 40s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.spin-slow{transform-box:fill-box; transform-origin:center; animation:spin 30s linear infinite}
.twinkle{animation:twinkle 2.4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
.rain{stroke:#9fb6d9; stroke-width:2; stroke-dasharray:6 10; animation:rain .5s linear infinite}
@keyframes rain{to{stroke-dashoffset:-16}}
.drift{animation:drift 70s linear infinite}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(1300px)}}

/* Machine */
#machine{position:absolute; left:345px; top:70px; width:520px; height:520px; z-index:250; cursor:pointer}
#machine svg{width:100%; height:100%; overflow:visible; transform-origin:50% 95%}
#machine.running svg{animation:wobble .22s ease-in-out infinite, hue 1.4s linear infinite}
@keyframes wobble{0%,100%{transform:rotate(-.8deg) translateY(0)}50%{transform:rotate(.8deg) translateY(-3px)}}
.mtitle{font-family:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif}
.gear{transform-box:fill-box; transform-origin:center; animation:spin var(--d,6s) linear infinite}
.gear.ccw{animation-direction:reverse}
#machine.running .gear{animation-duration:.8s}
@keyframes spin{to{transform:rotate(360deg)}}
.bulb{animation:blink 1.4s steps(1) infinite}
.bulb.b2{animation-delay:.7s}
#machine.running .bulb{animation-duration:.3s}
#machine.running .bulb.b2{animation-delay:.15s}
@keyframes blink{0%{fill:#ffe14d}50%{fill:#ff9ad5}}
.iris{animation:iris 3s linear infinite}
#machine.running .iris{animation-duration:.6s}
@keyframes iris{0%{fill:#39e6ff}33%{fill:#ff4fd8}66%{fill:#ffe14d}100%{fill:#39e6ff}}
.needle{transform-origin:400px 385px; animation:needle 2.6s ease-in-out infinite alternate}
#machine.running .needle{animation-duration:.25s}
@keyframes needle{from{transform:rotate(-55deg)}to{transform:rotate(55deg)}}
.puff{transform-box:fill-box; transform-origin:center; opacity:0; animation:puff 3.2s ease-out infinite}
#machine.running .puff{animation-duration:1s}
@keyframes puff{0%{opacity:.95; transform:translate(0,0) scale(.4)}100%{opacity:0; transform:translate(-24px,-80px) scale(1.8)}}

/* People */
.person{position:absolute; width:110px; height:156px; transform-origin:50% 100%;
  transition:left .6s cubic-bezier(.34,1.5,.6,1), top .6s cubic-bezier(.34,1.5,.6,1), transform .6s cubic-bezier(.34,1.5,.6,1), opacity .4s}
.bob{position:absolute; inset:0; transform-origin:50% 100%; animation:sway 3.4s ease-in-out infinite alternate; animation-delay:var(--dl,0s)}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.sign{position:absolute; top:0; left:0; width:110px; height:58px; display:flex; align-items:center; justify-content:center;
  padding:4px 7px; background:var(--sign-bg); color:var(--sign-ink); border:2.5px solid var(--line); border-radius:9px;
  box-shadow:2px 3px 0 var(--line); text-align:center; font-weight:800; font-size:11.5px; line-height:1.15; z-index:2}
.fig{position:absolute; top:52px; left:21px; width:70px; height:100px; overflow:visible; filter:saturate(.4) brightness(.9)}
.fig .leg{stroke:var(--line); stroke-width:4; stroke-linecap:round}
.fig .stick{stroke:#8a5a2b; stroke-width:4; stroke-linecap:round}
.fig .arm{fill:none; stroke-width:5; stroke-linecap:round}
.happy-arms,.happy-face{display:none}
.happy .happy-arms,.happy .happy-face{display:inline}
.happy .sad-arms,.happy .sad-face{display:none}
.happy .sign{background:linear-gradient(135deg,#ffe14d,#ff9ad5 55%,#9be7ff); transform:rotate(-3deg)}
.happy .fig{animation:aura 2.4s linear infinite}
@keyframes aura{
  0%{filter:drop-shadow(0 0 7px #ffe14d)} 33%{filter:drop-shadow(0 0 7px #ff4fd8)}
  66%{filter:drop-shadow(0 0 7px #39e6ff)} 100%{filter:drop-shadow(0 0 7px #ffe14d)}}
.happy.cheer .bob{animation:jump .8s ease-in-out infinite; animation-delay:var(--dl,0s)}
@keyframes jump{0%,100%{transform:translateY(0) rotate(-2deg)}45%{transform:translateY(-15px) rotate(2deg)}}

/* FX */
.word{position:absolute; z-index:1500; font-family:"Lilita One","Arial Rounded MT Bold",sans-serif; font-size:30px;
  -webkit-text-stroke:2px #2b2d42; paint-order:stroke fill; pointer-events:none; white-space:nowrap}
.confetti{position:absolute; z-index:1600; width:10px; height:10px; border-radius:50%; pointer-events:none}
.confetti.sq{border-radius:2px; height:13px; width:8px}
#banner{position:absolute; left:50%; top:582px; transform:translateX(-50%) scale(0); z-index:2000;
  background:var(--banner-bg); color:var(--banner-ink); border:4px solid var(--line); border-radius:999px;
  padding:8px 26px; font-family:"Lilita One","Arial Rounded MT Bold",sans-serif; font-size:26px; white-space:nowrap;
  box-shadow:0 5px 0 var(--line); transition:transform .5s cubic-bezier(.34,1.6,.6,1)}
#banner.show{transform:translateX(-50%) scale(1)}

/* Controls */
.controls{max-width:1200px; margin:14px auto 28px; padding:0 16px; display:flex; flex-wrap:wrap; align-items:center; gap:12px}
.btn{font-family:"Lilita One","Arial Rounded MT Bold",sans-serif; font-size:1.25rem; letter-spacing:.3px; color:var(--btn-ink);
  background:var(--btn); border:3px solid var(--line); border-radius:999px; padding:12px 24px; cursor:pointer;
  box-shadow:0 5px 0 var(--line); transition:transform .1s, box-shadow .1s}
.btn:active:not(:disabled){transform:translateY(4px); box-shadow:0 1px 0 var(--line)}
.btn.alt{background:var(--btn2); font-size:1.05rem; padding:10px 20px}
.btn.icon{background:var(--icon-bg); color:var(--icon-ink); font-size:1.1rem; padding:9px 14px}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--btn2); outline-offset:3px}
#count{font-weight:800; color:var(--muted); margin-left:auto}

@media (prefers-reduced-motion: reduce){
  #trippy,.bob,.drift,.gear,.bulb,.needle,.puff,.spin-slow,.twinkle,.rain,.iris,.happy .fig{animation:none !important}
  #machine.running svg{animation:none}
}
</style>
</head>

const soundBtn = document.getElementById('sound');
const countEl = document.getElementById('count');
const banner = document.getElementById('banner');
let queue = [], crowd = [], busy = false, auto = false, soundOn = true, actx = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- scene extras ---------- */
(function decorate(){
  const ns = "http://www.w3.org/2000/svg";
  const stars = document.getElementById('stars');
  for (let i = 0; i < 60; i++){
    const c = document.createElementNS(ns,'circle');
    c.setAttribute('class','twinkle');
    c.setAttribute('cx', 340 + Math.random()*860); c.setAttribute('cy', Math.random()*200);
    c.setAttribute('r', Math.random()*1.8+.6); c.setAttribute('fill', COLORS[i % COLORS.length]);
    c.style.animationDelay = (-Math.random()*2.4) + 's';
    stars.appendChild(c);
  }
  const rays = document.getElementById('rays');
  for (let i = 0; i < 16; i++){
    const p = document.createElementNS(ns,'path');
    p.setAttribute('d','M-6 -36 L0 -62 L6 -36 Z');
    p.setAttribute('fill', COLORS[i % COLORS.length]);
    p.setAttribute('transform', `rotate(${i*22.5})`);
    rays.appendChild(p);
  }
  const shrooms = document.getElementById('shrooms');
  const S = [[1172,562,1.3,'#ffe14d'],[1165,208,.8,'#ff4fd8'],[560,606,.9,'#ff4f6d'],[700,610,.7,'#39e6ff'],[325,592,1,'#9b5cff'],[1110,560,.8,'#ff4fd8']];
  shrooms.innerHTML = S.map(([x,y,s,cap]) => `<g transform="translate(${x} ${y}) scale(${s})">
    <path d="M-6 0 Q-8 -18 -5 -26 L5 -26 Q8 -18 6 0 Z" fill="#fff3e0" stroke="#2b2d42" stroke-width="2.5"/>
    <path d="M-22 -24 Q-20 -46 0 -48 Q20 -46 22 -24 Q0 -18 -22 -24Z" fill="${cap}" stroke="#2b2d42" stroke-width="2.5"/>
    <circle cx="-9" cy="-36" r="3" fill="#fff"/><circle cx="6" cy="-40" r="2.5" fill="#fff"/><circle cx="13" cy="-30" r="2" fill="#fff"/></g>`).join('');
})();

/* ---------- people ---------- */
function figure(d){
  const back = {
    1:`<circle cx="35" cy="31" r="17" fill="${d.hair}"/>`,
    2:`<path d="M20 36 C17 14 53 14 50 36 L51 56 L19 56 Z" fill="${d.hair}"/>`,
    3:`<circle cx="35" cy="17" r="6.5" fill="${d.hair}" stroke="#2b2d42" stroke-width="1.5"/>`
  }[d.style] || "";
  const front = {
    0:`<path d="M21.5 33 C20 16 50 16 48.5 33 C45 25 27 25 21.5 33Z" fill="${d.hair}"/>`,
    2:`<path d="M22 31 C25 18 45 18 48 31 C41 25 29 25 22 31Z" fill="${d.hair}"/>`,
    3:`<path d="M22 32 C22 19 48 19 48 32 C43 27 27 27 22 32Z" fill="${d.hair}"/>`
  }[d.style] || "";
  return `<svg class="fig" viewBox="0 0 70 100">
    ${back}
    <line class="leg" x1="30" y1="78" x2="27" y2="97"/><line class="leg" x1="40" y1="78" x2="43" y2="97"/>
    <path d="M22 55 Q22 46 35 46 Q48 46 48 55 L47 80 L23 80 Z" fill="${d.shirt}" stroke="#2b2d42" stroke-width="2.5" stroke-linejoin="round"/>
    <line class="stick" x1="54" y1="-2" x2="54" y2="50"/>
    <g class="sad-arms"><path class="arm" stroke="${d.skin}" d="M24 53 L18 71"/><path class="arm" stroke="${d.skin}" d="M46 53 L54 43"/></g>
    <g class="happy-arms"><path class="arm" stroke="${d.skin}" d="M24 53 L11 33"/><path class="arm" stroke="${d.skin}" d="M46 53 L54 43"/></g>
    <circle cx="35" cy="34" r="13" fill="${d.skin}" stroke="#2b2d42" stroke-width="2"/>
    ${front}
    <g class="sad-face" stroke="#2b2d42" stroke-linecap="round" fill="none">
      <circle cx="30" cy="35" r="1.8" fill="#2b2d42" stroke="none"/><circle cx="40" cy="35" r="1.8" fill="#2b2d42" stroke="none"/>
      <path d="M27 30.5 L32 29" stroke-width="1.6"/><path d="M43 30.5 L38 29" stroke-width="1.6"/>
      <path d="M31 42.5 Q35 39.5 39 42.5" stroke-width="2"/>
    </g>
    <g class="happy-face">
      <path d="M27.5 35 Q30 31.5 32.5 35" fill="none" stroke="#2b2d42" stroke-width="2" stroke-linecap="round"/>
      <path d="M37.5 35 Q40 31.5 42.5 35" fill="none" stroke="#2b2d42" stroke-width="2" stroke-linecap="round"/>
      <path d="M28.5 39 Q35 48 41.5 39 Z" fill="#2b2d42"/>
      <circle cx="26" cy="39" r="2.5" fill="#ff5d8f" opacity=".5"/><circle cx="44" cy="39" r="2.5" fill="#ff5d8f" opacity=".5"/>
      <g stroke="#2b2d42" stroke-width="1">
        <circle cx="24" cy="25" r="3" fill="#ff4fd8"/><circle cx="29.5" cy="21" r="3" fill="#ffe14d"/>
        <circle cx="35" cy="19.5" r="3" fill="#39e6ff"/><circle cx="40.5" cy="21" r="3" fill="#3ee58a"/>
        <circle cx="46" cy="25" r="3" fill="#9b5cff"/>
      </g>
    </g>
  </svg>`;
}

function makePerson(d, i){
  const el = document.createElement('div');
  el.className = 'person';
  el.innerHTML = `<div class="bob" style="--dl:${-(i*0.41)%2}s"><div class="sign"><span></span></div>${figure(d)}</div>`;
  el.querySelector('.sign span').textContent = d.q;
  stage.appendChild(el);
  return {el, sign: el.querySelector('.sign span'), data: d};
}
function place(p, x, y, s, z){
  p.el.style.left = x + 'px'; p.el.style.top = y + 'px';
  p.el.style.transform = `scale(${s})`;
  p.el.style.zIndex = z ?? Math.round(y + 156);
}
function layoutQueue(){ queue.forEach((p, i) => place(p, Q[i].x, Q[i].y, Q[i].s)); }

/* ---------- sound (dreamy pentatonic) ---------- */
const PENTA = [262,294,330,392,440,523,587,659,784,880];
function tone(f, t0, dur, type = 'sine', vol = .07){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .03);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + .05);
}
function sfx(kind){
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    if (kind === 'in') [659,523,440,330,262].forEach((f,i) => tone(f, t + i*.07, .3));
    if (kind === 'blip') tone(PENTA[Math.floor(Math.random()*PENTA.length)], t, .35, 'sine', .04);
    if (kind === 'out') [392,523,659,784,1047].forEach((f,i) => tone(f, t + i*.08, .45, 'triangle', .06));
    if (kind === 'fanfare') [262,330,392,523,659,784,1047].forEach((f,i) => tone(f, t + i*.13, .9, 'sine', .07));
  } catch(e){}
}

/* ---------- effects ---------- */
function spawnWord(){
  const w = document.createElement('div');
  w.className = 'word';
  w.textContent = WORDS[Math.floor(Math.random()*WORDS.length)];
  w.style.color = COLORS[Math.floor(Math.random()*COLORS.length)];
  w.style.left = (420 + Math.random()*300) + 'px';
  w.style.top = (60 + Math.random()*120) + 'px';
  stage.appendChild(w);
  const r = (Math.random()*30 - 15);
  w.animate([
    {transform:`scale(.3) rotate(${r}deg)`, opacity:0},
    {transform:`scale(1.1) rotate(${r}deg)`, opacity:1, offset:.25},
    {transform:`translateY(-50px) scale(1) rotate(${-r}deg)`, opacity:0}
  ], {duration:1000, easing:'ease-out'}).onfinish = () => w.remove();
  sfx('blip');
}
function confetti(x, y, n, spread = 1){
  for (let i = 0; i < n; i++){
    const c = document.createElement('div');
    c.className = 'confetti' + (i % 2 ? ' sq' : '');
    c.style.background = COLORS[i % COLORS.length];
    c.style.left = x + 'px'; c.style.top = y + 'px';
    stage.appendChild(c);
    const dx = (Math.random()*260 - 80) * spread, up = 80 + Math.random()*180, rot = Math.random()*720 - 360;
    c.animate([
      {transform:'translate(0,0) rotate(0)', opacity:1},
      {transform:`translate(${dx*.6}px,${-up}px) rotate(${rot/2}deg)`, opacity:1, offset:.4},
      {transform:`translate(${dx}px,${120 + Math.random()*80}px) rotate(${rot}deg)`, opacity:0}
    ], {duration:1500 + Math.random()*700, easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish = () => c.remove();
  }
}

/* ---------- game flow ---------- */
function update(){
  countEl.textContent = `${crowd.length} of ${PEOPLE.length} found their tribe`;
  goBtn.textContent = queue.length ? 'Send the next seeker' : 'Run it again';
  goBtn.disabled = busy || auto;
  allBtn.disabled = busy || auto || !queue.length;
}
async function processNext(){
  if (busy || !queue.length) return;
  busy = true; update();
  const p = queue.shift();

  place(p, 268, 345, 1, 600);
  await sleep(500);

  machine.classList.add('running');
  sfx('in');
  p.el.style.transition = 'left .45s ease-in, top .45s ease-in, transform .45s ease-in, opacity .45s ease-in';
  place(p, 300, 229, .08, 600);
  p.el.style.opacity = 0;
  layoutQueue();
  spawnWord();
  const ticker = setInterval(spawnWord, 340);
  await sleep(1600);
  clearInterval(ticker);

  p.el.classList.add('happy');
  p.sign.textContent = p.data.a;
  p.el.style.transition = 'none';
  place(p, 795, 314, .15, 600);
  void p.el.offsetWidth;
  p.el.style.transition = '';
  p.el.style.opacity = 1;
  place(p, 830, 380, 1, 600);
  confetti(857, 470, 40);
  sfx('out');
  machine.classList.remove('running');
  await sleep(650);

  const spot = C[crowd.length];
  crowd.push(p);
  place(p, spot.x, spot.y, spot.s);
  p.el.classList.add('cheer');
  await sleep(550);

  busy = false;
  if (!queue.length) finale();
  update();
}
function finale(){
  banner.classList.add('show');
  sfx('fanfare');
  [880, 980, 1080].forEach((x, i) => setTimeout(() => confetti(x, 120, 34, 1.2), i*180));
}
function reset(){
  [...queue, ...crowd].forEach(p => p.el.remove());
  crowd = [];
  queue = PEOPLE.map(makePerson);
  queue.forEach(p => p.el.style.transition = 'none');
  layoutQueue();
  requestAnimationFrame(() => requestAnimationFrame(() => queue.forEach(p => p.el.style.transition = '')));
  banner.classList.remove('show');
  update();
}

goBtn.addEventListener('click', () => { if (!queue.length && !busy) reset(); else processNext(); });
machine.addEventListener('click', () => { if (!auto) processNext(); });
allBtn.addEventListener('click', async () => {
  auto = true; update();
  while (queue.length){ await processNext(); await sleep(150); }
  auto = false; update();
});
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊' : '🔈';
  soundBtn.setAttribute('aria-label', soundOn ? 'Turn sound off' : 'Turn sound on');
});

/* ---------- fit to screen ---------- */
const scroller = document.querySelector('.scroller'), sizer = document.getElementById('sizer');
function fit(){
  const s = Math.min(1, Math.max(scroller.clientWidth / 1200, .55));
  stage.style.transform = `scale(${s})`;
  sizer.style.width = 1200*s + 'px';
  sizer.style.height = 640*s + 'px';
}
window.addEventListener('resize', fit);
fit();
reset();
</script>
</body>
